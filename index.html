<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Rob Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #09090e;
            color: #fff;
            overflow: hidden;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-text-blue {
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }
        .neon-text-pink {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }
        .neon-text-gold {
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
            border: 2px solid #00f0ff;
        }
        .neon-btn {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transition: all 0.2s ease;
        }
        .neon-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.9);
        }
        .neon-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center relative bg-black">

    <!-- Game Canvas Wrapper -->
    <div id="game-wrapper" class="relative w-full h-full max-w-5xl max-h-[700px] flex justify-center items-center overflow-hidden sm:rounded-2xl border-0 sm:border-2 border-cyan-500/30">
        
        <!-- Main Game Canvas -->
        <canvas id="gameCanvas" class="w-full h-full block bg-black"></canvas>

        <!-- HUD Layer -->
        <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center pointer-events-none hidden font-orbitron">
            <!-- Rings Score -->
            <div class="flex items-center gap-2 bg-black/60 backdrop-blur-md px-4 py-2 rounded-xl border border-yellow-500/50">
                <div class="w-6 h-6 rounded-full border-4 border-yellow-400 bg-yellow-300/30 shadow-[0_0_10px_#ffd700]"></div>
                <span id="hud-rings" class="text-2xl font-black text-yellow-400 neon-text-gold">0</span>
            </div>

            <!-- Timer Bar -->
            <div class="flex flex-col items-center bg-black/60 backdrop-blur-md px-6 py-2 rounded-xl border border-cyan-500/50">
                <span class="text-xs text-cyan-400 tracking-widest">TEMPO RESTANTE</span>
                <span id="hud-timer" class="text-2xl font-black text-cyan-300 neon-text-blue">60s</span>
            </div>

            <!-- Best Score -->
            <div class="flex items-center gap-2 bg-black/60 backdrop-blur-md px-4 py-2 rounded-xl border border-pink-500/50">
                <span class="text-xs text-pink-400 tracking-wider hidden sm:inline">RECORDE:</span>
                <span id="hud-highscore" class="text-xl font-bold text-pink-300 neon-text-pink">0</span>
            </div>
        </div>

        <!-- Start Overlay Screen -->
        <div id="start-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center z-10">
            <h1 class="text-4xl sm:text-6xl font-black font-orbitron italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 mb-2">
                CYBER ROB RUNNER
            </h1>
            <p class="text-cyan-300/80 text-lg sm:text-xl mb-6 max-w-md">
                Corra, role nos loops e colete o máximo de anéis dourados antes que o tempo de <span class="text-yellow-400 font-bold">1 minuto</span> acabe!
            </p>

            <!-- Character Preview -->
            <div class="w-24 h-24 mb-6 relative flex justify-center items-center bg-cyan-950/40 rounded-full border-2 border-cyan-400/50 shadow-[0_0_20px_rgba(0,240,255,0.3)]">
                <img src="https://robertdelima.github.io/rob-icon.png" alt="Rob Character" class="w-16 h-16 object-contain animate-bounce">
            </div>

            <div class="flex flex-col sm:flex-row gap-4 items-center mb-8 text-sm text-slate-300">
                <div class="flex items-center gap-2 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700">
                    <span class="px-2 py-1 bg-slate-800 rounded font-mono font-bold text-cyan-400">ESPAÇO</span>
                    <span>ou</span>
                    <span class="px-2 py-1 bg-slate-800 rounded font-mono font-bold text-cyan-400">TOQUE</span>
                    <span>para Pular</span>
                </div>
            </div>

            <button id="btn-start" class="neon-btn px-10 py-4 text-2xl font-black font-orbitron rounded-xl text-white tracking-wider uppercase">
                JOGAR
            </button>

            <div class="mt-6 text-yellow-400/90 font-orbitron font-semibold">
                MAIOR RECORDE: <span id="start-highscore" class="text-yellow-300 text-xl font-bold">0</span> ANÉIS
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-lg flex flex-col justify-center items-center p-6 text-center z-10 hidden">
            <h2 id="gameover-title" class="text-4xl sm:text-5xl font-black font-orbitron text-pink-500 neon-text-pink mb-2">
                FIM DE JOGO
            </h2>
            <p id="gameover-subtitle" class="text-slate-300 mb-6 text-lg">Você caiu no abismo!</p>

            <div class="bg-slate-900/90 p-6 rounded-2xl border border-cyan-500/40 w-full max-w-xs mb-6 flex flex-col gap-4 shadow-2xl">
                <div>
                    <div class="text-xs text-slate-400 font-orbitron uppercase">Anéis Coletados</div>
                    <div id="final-rings" class="text-4xl font-black font-orbitron text-yellow-400 neon-text-gold">0</div>
                </div>
                <div class="border-t border-slate-800 pt-3">
                    <div class="text-xs text-slate-400 font-orbitron uppercase">Melhor Recorde</div>
                    <div id="final-highscore" class="text-2xl font-bold font-orbitron text-cyan-300">0</div>
                </div>
                <div id="new-record-badge" class="hidden bg-yellow-500/20 text-yellow-300 border border-yellow-500/50 py-1 rounded-md font-orbitron font-bold text-sm animate-pulse">
                    🏆 NOVO RECORDE!
                </div>
            </div>

            <button id="btn-restart" class="neon-btn px-8 py-3 text-xl font-black font-orbitron rounded-xl text-white tracking-wider uppercase">
                JOGAR NOVAMENTE
            </button>
        </div>
    </div>

    <script>
        // Synthesized Web Audio API sound generator to avoid external asset loading issues
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playRing() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';

                // Sonic ring sound simulation (B6 -> E7 frequency blend)
                osc1.frequency.setValueAtTime(987.77, now);
                osc1.frequency.setValueAtTime(1318.51, now + 0.08);

                osc2.frequency.setValueAtTime(1318.51, now);
                osc2.frequency.setValueAtTime(1758.40, now + 0.08);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.3);
                osc2.stop(now + 0.3);
            }

            playGameOver() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.6);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.6);
            }

            playVictory() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + index * 0.1);
                    osc.stop(now + index * 0.1 + 0.25);
                });
            }
        }

        const sound = new SoundFX();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Character image sprite
        const playerImg = new Image();
        playerImg.src = 'https://robertdelima.github.io/rob-icon.png';

        // DOM elements
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const hud = document.getElementById('hud');
        const hudRings = document.getElementById('hud-rings');
        const hudTimer = document.getElementById('hud-timer');
        const hudHighscore = document.getElementById('hud-highscore');
        const startHighscore = document.getElementById('start-highscore');
        const finalRings = document.getElementById('final-rings');
        const finalHighscore = document.getElementById('final-highscore');
        const gameoverTitle = document.getElementById('gameover-title');
        const gameoverSubtitle = document.getElementById('gameover-subtitle');
        const newRecordBadge = document.getElementById('new-record-badge');

        // Game Configuration & State
        let gameWidth = 800;
        let gameHeight = 450;
        let isPlaying = false;
        let animationFrameId = null;
        let gameTime = 60; // 1 minute
        let timerInterval = null;
        let ringsCollected = 0;
        let highScore = parseInt(localStorage.getItem('rob_runner_highscore') || '0', 10);
        let worldX = 0; // World progression distance
        let speed = 7.5; // Base horizontal auto-runner speed

        // Resize Canvas to fit container while maintaining virtual coordinate space
        function resizeCanvas() {
            const wrapper = document.getElementById('game-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            gameWidth = canvas.width;
            gameHeight = canvas.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Update high score displays initially
        startHighscore.textContent = highScore;
        hudHighscore.textContent = highScore;

        const player = {
            x: 120,
            y: 200,
            width: 52,
            height: 52,
            vy: 0,
            gravity: 0.65,
            jumpForce: -13.5,
            isGrounded: false,
            rotation: 0,
            inLoop: false,
            loopProgress: 0,
            currentLoop: null,

            reset() {
                this.x = 120;
                this.y = 200;
                this.vy = 0;
                this.isGrounded = false;
                this.rotation = 0;
                this.inLoop = false;
                this.loopProgress = 0;
                this.currentLoop = null;
            },

            jump() {
                if (this.isGrounded && !this.inLoop) {
                    this.vy = this.jumpForce;
                    this.isGrounded = false;
                    sound.playJump();
                }
            },

            update() {
                if (this.inLoop && this.currentLoop) {
                    // Loop-de-loop animation physics
                    this.loopProgress += 0.045;
                    const angle = this.loopProgress * Math.PI * 2;
                    
                    // Parametric circle formula relative to loop center
                    this.x = this.currentLoop.centerX - worldX + Math.sin(angle) * this.currentLoop.radius;
                    this.y = this.currentLoop.centerY - Math.cos(angle) * this.currentLoop.radius;
                    
                    // Continuous rolling rotation during loop
                    this.rotation += 0.25;

                    if (this.loopProgress >= 1) {
                        this.inLoop = false;
                        this.isGrounded = true;
                        this.y = this.currentLoop.groundY - this.height;
                        this.currentLoop = null;
                    }
                    return;
                }

                // Normal Gravity and Movement physics
                this.vy += this.gravity;
                this.y += this.vy;

                // Rotation mechanic: Rolls while running/in air, stands vertical when grounded and stopped
                if (!this.isGrounded || speed > 0) {
                    this.rotation += 0.22; // Spin continuously while running/jumping
                }

                // Ground Collision check against generated platforms
                let grounded = false;
                const footX = worldX + this.x + this.width / 2;
                const footY = this.y + this.height;

                for (let plat of platforms) {
                    // Check horizontal overlap
                    if (footX >= plat.x && footX <= plat.x + plat.width) {
                        // Check vertical collision at platform height
                        if (this.vy >= 0 && footY >= plat.y && footY <= plat.y + 18) {
                            this.y = plat.y - this.height;
                            this.vy = 0;
                            grounded = true;
                            break;
                        }
                    }
                }

                this.isGrounded = grounded;

                // Reset upright standing rotation when grounded
                if (this.isGrounded) {
                    // Snap towards 0 angle (standing straight) when landed
                    this.rotation = Math.round(this.rotation / (Math.PI * 2)) * Math.PI * 2;
                }

                // Check Loop Entry
                for (let loop of loops) {
                    const loopStartX = loop.centerX - worldX - loop.radius;
                    if (!this.inLoop && Math.abs(this.x - loopStartX) < 25 && Math.abs((this.y + this.height) - loop.groundY) < 30) {
                        this.inLoop = true;
                        this.loopProgress = 0;
                        this.currentLoop = loop;
                        break;
                    }
                }

                // Check fall into gap (death)
                if (this.y > gameHeight + 100) {
                    endGame(false, "Você caiu no abismo!");
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);

                if (playerImg.complete && playerImg.naturalWidth !== 0) {
                    ctx.drawImage(playerImg, -this.width / 2, -this.height / 2, this.width, this.height);
                } else {
                    // Fallback visual avatar if image fails to load
                    ctx.fillStyle = '#00f0ff';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff007f';
                    ctx.fillRect(-5, -5, 10, 10);
                }

                ctx.restore();
            }
        };

        let platforms = [];
        let loops = [];
        let rings = [];

        function generateLevelSegment(minX) {
            let currentX = minX;

            while (currentX < minX + 2000) {
                const platWidth = 400 + Math.random() * 500;
                const platY = gameHeight - 90 - (Math.random() > 0.4 ? Math.random() * 70 : 0);

                // Add Platform
                platforms.push({
                    x: currentX,
                    y: platY,
                    width: platWidth,
                    height: 120
                });

                // Decide whether to place a Loop or regular Ring Formations on this platform
                const hasLoop = Math.random() < 0.35 && platWidth > 450;

                if (hasLoop) {
                    const loopRadius = 60 + Math.random() * 20;
                    const loopCenterX = currentX + platWidth / 2;
                    const loopObj = {
                        centerX: loopCenterX,
                        centerY: platY - loopRadius,
                        radius: loopRadius,
                        groundY: platY
                    };
                    loops.push(loopObj);

                    // Spawn rings inside the loop along its arc
                    for (let a = 0; a < Math.PI * 2; a += Math.PI / 5) {
                        rings.push({
                            worldX: loopCenterX + Math.sin(a) * (loopRadius - 10),
                            y: platY - loopRadius - Math.cos(a) * (loopRadius - 10),
                            radius: 10,
                            collected: false,
                            rotation: 0
                        });
                    }
                } else {
                    // Spawn horizontal ring lines or arcs on platform
                    const ringPattern = Math.floor(Math.random() * 3);
                    const ringCount = 4 + Math.floor(Math.random() * 5);
                    const startRingX = currentX + 80 + Math.random() * (platWidth - 250);

                    for (let r = 0; r < ringCount; r++) {
                        let ringY = platY - 30;
                        if (ringPattern === 1) { // Arc formation
                            ringY -= Math.sin((r / ringCount) * Math.PI) * 60;
                        } else if (ringPattern === 2) { // High floating line
                            ringY -= 75;
                        }
                        rings.push({
                            worldX: startRingX + r * 32,
                            y: ringY,
                            radius: 10,
                            collected: false,
                            rotation: Math.random() * Math.PI
                        });
                    }
                }

                // Random Gap/Pit size between platforms
                const gap = 110 + Math.random() * 120;
                currentX += platWidth + gap;
            }
        }

        function initLevel() {
            worldX = 0;
            platforms = [];
            loops = [];
            rings = [];
            // Safe initial platform under player
            platforms.push({ x: 0, y: gameHeight - 90, width: 800, height: 120 });
            generateLevelSegment(800);
        }

        function drawParallaxBackground() {
            // Gradient Sky
            const grad = ctx.createLinearGradient(0, 0, 0, gameHeight);
            grad.addColorStop(0, '#040212');
            grad.addColorStop(0.5, '#12082b');
            grad.addColorStop(1, '#280b3a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, gameWidth, gameHeight);

            // Layer 1: Distant Cyber City Skyline (Slowest parallax)
            ctx.fillStyle = '#180e38';
            const bgX1 = -(worldX * 0.1) % 120;
            for (let x = bgX1 - 120; x < gameWidth + 120; x += 60) {
                const h = 120 + Math.sin(x * 0.02) * 50 + (x % 30) * 3;
                ctx.fillRect(x, gameHeight - 100 - h, 55, h + 100);
            }

            // Layer 2: Midground Neon Grid Buildings
            const bgX2 = -(worldX * 0.25) % 160;
            for (let x = bgX2 - 160; x < gameWidth + 160; x += 90) {
                const h = 80 + Math.cos(x * 0.03) * 40;
                ctx.fillStyle = '#2d124d';
                ctx.fillRect(x, gameHeight - 90 - h, 80, h + 90);

                // Neon Windows
                ctx.fillStyle = '#ff007f';
                for (let wy = gameHeight - 80 - h; wy < gameHeight - 100; wy += 18) {
                    if ((x + wy) % 3 === 0) {
                        ctx.fillRect(x + 12, wy, 12, 8);
                        ctx.fillRect(x + 52, wy, 12, 8);
                    }
                }
            }

            // Futuristic Grid Lines on horizon
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let y = gameHeight - 120; y < gameHeight; y += 15) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(gameWidth, y);
                ctx.stroke();
            }
        }

        function drawWorld() {
            // 1. Draw Platforms
            for (let plat of platforms) {
                const screenX = plat.x - worldX;
                if (screenX + plat.width < -100 || screenX > gameWidth + 100) continue;

                // Platform Body
                const platGrad = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.height);
                platGrad.addColorStop(0, '#151933');
                platGrad.addColorStop(1, '#080a18');
                ctx.fillStyle = platGrad;
                ctx.fillRect(screenX, plat.y, plat.width, plat.height);

                // Neon Top Edge
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.fillRect(screenX, plat.y, plat.width, 4);
                ctx.shadowBlur = 0; // reset

                // Decorative pattern on platform edge
                ctx.fillStyle = '#ff007f';
                for (let px = screenX + 10; px < screenX + plat.width - 20; px += 40) {
                    ctx.fillRect(px, plat.y + 12, 16, 3);
                }
            }

            // 2. Draw Loops
            for (let loop of loops) {
                const screenCenterX = loop.centerX - worldX;
                if (screenCenterX + loop.radius < -100 || screenCenterX - loop.radius > gameWidth + 100) continue;

                ctx.lineWidth = 12;
                ctx.strokeStyle = '#1a1c38';
                ctx.beginPath();
                ctx.arc(screenCenterX, loop.centerY, loop.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Outer Neon Rim
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(screenCenterX, loop.centerY, loop.radius + 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 3. Draw and Update Rings
            const playerBox = {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height
            };

            for (let ring of rings) {
                if (ring.collected) continue;
                const screenX = ring.worldX - worldX;
                if (screenX < -20 || screenX > gameWidth + 20) continue;

                // Continuous spin animation
                ring.rotation += 0.08;
                const scaleX = Math.sin(ring.rotation);

                ctx.save();
                ctx.translate(screenX, ring.y);
                ctx.scale(scaleX, 1);

                // Draw Golden Ring
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, ring.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();

                // Ring Collision check
                const dist = Math.hypot(player.x + player.width / 2 - screenX, player.y + player.height / 2 - ring.y);
                if (dist < player.width / 2 + ring.radius) {
                    ring.collected = true;
                    ringsCollected++;
                    hudRings.textContent = ringsCollected;
                    sound.playRing();
                }
            }
        }

        function gameLoop() {
            if (!isPlaying) return;

            // Clear canvas
            ctx.clearRect(0, 0, gameWidth, gameHeight);

            // Progress world horizontal movement
            worldX += speed;

            // Check if level generation needs expansion
            const lastPlat = platforms[platforms.length - 1];
            if (lastPlat.x - worldX < gameWidth + 1000) {
                generateLevelSegment(lastPlat.x + lastPlat.width + 120);
            }

            // Cleanup old platforms off-screen to optimize memory
            platforms = platforms.filter(p => p.x - worldX + p.width > -200);
            loops = loops.filter(l => l.centerX - worldX + l.radius > -200);
            rings = rings.filter(r => r.worldX - worldX > -200 && !r.collected);

            // Render components
            drawParallaxBackground();
            drawWorld();

            // Update & Render Player
            player.update();
            player.draw();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startTimer() {
            clearInterval(timerInterval);
            gameTime = 60;
            hudTimer.textContent = `${gameTime}s`;

            timerInterval = setInterval(() => {
                gameTime--;
                hudTimer.textContent = `${gameTime}s`;

                if (gameTime <= 10) {
                    hudTimer.classList.add('text-pink-500', 'animate-pulse');
                } else {
                    hudTimer.classList.remove('text-pink-500', 'animate-pulse');
                }

                if (gameTime <= 0) {
                    endGame(true, "Tempo Esgotado!");
                }
            }, 1000);
        }

        function startGame() {
            sound.init();
            isPlaying = true;
            ringsCollected = 0;
            hudRings.textContent = '0';
            hudHighscore.textContent = highScore;

            player.reset();
            initLevel();

            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            hud.classList.remove('hidden');

            startTimer();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function endGame(timeUp = false, reason = "") {
            isPlaying = false;
            clearInterval(timerInterval);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            // Save High Score in localStorage
            let isNewRecord = false;
            if (ringsCollected > highScore) {
                highScore = ringsCollected;
                localStorage.setItem('rob_runner_highscore', highScore.toString());
                isNewRecord = true;
                sound.playVictory();
            } else {
                sound.playGameOver();
            }

            // Update UI
            finalRings.textContent = ringsCollected;
            finalHighscore.textContent = highScore;
            startHighscore.textContent = highScore;
            hudHighscore.textContent = highScore;

            if (timeUp) {
                gameoverTitle.textContent = "TEMPO ESGOTADO!";
                gameoverTitle.className = "text-4xl sm:text-5xl font-black font-orbitron text-yellow-400 neon-text-gold mb-2";
                gameoverSubtitle.textContent = `Você coletou ${ringsCollected} anéis em 1 minuto!`;
            } else {
                gameoverTitle.textContent = "FIM DE JOGO";
                gameoverTitle.className = "text-4xl sm:text-5xl font-black font-orbitron text-pink-500 neon-text-pink mb-2";
                gameoverSubtitle.textContent = reason || "Você caiu no abismo!";
            }

            if (isNewRecord) {
                newRecordBadge.classList.remove('hidden');
            } else {
                newRecordBadge.classList.add('hidden');
            }

            hud.classList.add('hidden');
            gameoverScreen.classList.remove('hidden');
        }

        // Key controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isPlaying) {
                    player.jump();
                }
            }
        });

        // Touch & Click controls for Mobile/PC
        const gameWrapper = document.getElementById('game-wrapper');
        
        function handleInputTrigger(e) {
            // Prevent triggering jump when clicking UI buttons
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

            if (isPlaying) {
                player.jump();
            }
        }

        gameWrapper.addEventListener('touchstart', (e) => {
            handleInputTrigger(e);
        }, { passive: true });

        gameWrapper.addEventListener('mousedown', (e) => {
            handleInputTrigger(e);
        });

        // UI Buttons
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', startGame);

    </script>
</body>
</html>
